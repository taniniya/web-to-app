plugins {
    id 'com.android.application'
}

android {
    namespace 'com.taniniya.webtoapp'
    compileSdk 34

    // Optional: explicit debug keystore for environments without a resolvable user home
    // (e.g. sandbox builds). CI runners use the standard auto-generated debug keystore.
    def localKeystore = System.getenv("DEBUG_KEYSTORE")
    signingConfigs {
        if (localKeystore != null && file(localKeystore).exists()) {
            localDebug {
                storeFile file(localKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId "com.taniniya.webtoapp"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "2.1"
    }

    buildTypes {
        debug {
            def localDebug = signingConfigs.findByName('localDebug')
            if (localDebug != null) {
                signingConfig localDebug
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // APK 署名エンジン (v1/v2/v3) — Pure Java、依存ライブラリなし
    implementation 'com.android.tools.build:apksig:8.4.2'
}
