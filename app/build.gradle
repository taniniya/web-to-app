plugins {
    id 'com.android.application'
}

android {
    namespace 'com.taniniya.webtoapp'
    compileSdk 34

    // Debug signing: use DEBUG_KEYSTORE when set, otherwise always sign with the
    // keystore bundled at src/main/assets/debug.keystore so that every build (local
    // and CI) keeps the same signing identity and can update an installed copy.
    def localKeystore = System.getenv("DEBUG_KEYSTORE")
    if (localKeystore == null || !file(localKeystore).exists()) {
        def bundled = file("src/main/assets/debug.keystore")
        if (bundled.exists()) localKeystore = bundled.path
    }
    signingConfigs {
        if (localKeystore != null && file(localKeystore).exists()) {
            localDebug {
                storeFile file(localKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId "com.taniniya.webtoapp"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "2.1"
    }

    buildTypes {
        debug {
            def localDebug = signingConfigs.findByName('localDebug')
            if (localDebug != null) {
                signingConfig localDebug
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // APK 署名エンジン (v1/v2/v3) — Pure Java、依存ライブラリなし
    implementation 'com.android.tools.build:apksig:8.4.2'
}
